[pytest]
# Only this repository's own tests. src/clamp and src/noise_inject are local
# copies of other projects and are not tracked here; NoiseInject's tests run in
# its own repository.
testpaths = tests
# tests/archive holds retired scripts that import functions which no longer
# exist; tests/results* hold outputs, not tests.
norecursedirs = tests/archive tests/results* tests/data_cache __pycache__ .git
